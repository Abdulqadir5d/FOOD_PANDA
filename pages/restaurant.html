<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Menu - Foodpanda</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/restaurant.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <nav class="navbar">
            <div class="nav-container">
                <div class="nav-brand">
                    <img src="../images/logo.png" alt="Foodpanda" class="logo">
                </div>
                <div class="nav-menu">
                    <ul class="nav-list">
                        <li><a href="../index.html" class="nav-link">Home</a></li>
                        <li><a href="restaurants.html" class="nav-link">Restaurants</a></li>
                        <li><a href="about.html" class="nav-link">About</a></li>
                        <li><a href="contact.html" class="nav-link">Contact</a></li>
                    </ul>
                </div>
                <div class="nav-actions">
                    <button class="btn-login" onclick="location.href='login.html'">Log In</button>
                    <button class="btn-signup" onclick="location.href='signup.html'">Sign Up</button>
                    <div class="cart-icon" onclick="location.href='cart.html'">
                        <i class="fas fa-shopping-cart"></i>
                        <span class="cart-count">0</span>
                    </div>
                </div>
                <div class="mobile-menu-toggle">
                    <i class="fas fa-bars"></i>
                </div>
            </div>
        </nav>
    </header>

    <!-- Restaurant Header -->
    <section class="restaurant-header" id="restaurantHeader">
        <!-- Restaurant info will be loaded here -->
    </section>

    <!-- Menu Categories -->
    <section class="menu-categories">
        <div class="container">
            <div class="categories-nav" id="categoriesNav">
                <!-- Categories will be loaded here -->
            </div>
        </div>
    </section>

    <!-- Menu Items -->
    <section class="menu-section">
        <div class="container">
            <div class="menu-layout">
                <div class="menu-content">
                    <div class="menu-items" id="menuItems">
                        <!-- Menu items will be loaded here -->
                    </div>
                </div>
                
                <!-- Cart Sidebar -->
                <div class="cart-sidebar" id="cartSidebar">
                    <div class="cart-header">
                        <h3>Your Order</h3>
                        <button class="close-cart" onclick="toggleCart()">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                    <div class="cart-items" id="cartItems">
                        <!-- Cart items will be loaded here -->
                    </div>
                    <div class="cart-summary">
                        <div class="cart-total">
                            <span>Total:</span>
                            <span id="cartTotal">$0.00</span>
                        </div>
                        <button class="btn btn-primary checkout-btn" onclick="proceedToCheckout()">
                            Proceed to Checkout
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Floating Cart Button -->
    <div class="floating-cart" id="floatingCart" onclick="toggleCart()">
        <i class="fas fa-shopping-cart"></i>
        <span class="cart-count" id="floatingCartCount">0</span>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-section">
                    <h3>Company</h3>
                    <ul>
                        <li><a href="about.html">About Us</a></li>
                        <li><a href="#">Careers</a></li>
                        <li><a href="#">Press</a></li>
                    </ul>
                </div>
                <div class="footer-section">
                    <h3>Support</h3>
                    <ul>
                        <li><a href="contact.html">Contact Us</a></li>
                        <li><a href="#">Help Center</a></li>
                        <li><a href="#">Terms of Service</a></li>
                    </ul>
                </div>
                <div class="footer-section">
                    <h3>Follow Us</h3>
                    <div class="social-links">
                        <a href="#"><i class="fab fa-facebook"></i></a>
                        <a href="#"><i class="fab fa-twitter"></i></a>
                        <a href="#"><i class="fab fa-instagram"></i></a>
                    </div>
                </div>
            </div>
            <div class="footer-bottom">
                <p>&copy; 2024 Foodpanda Clone. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="../js/main.js"></script>
    <script src="../js/restaurant.js"></script>
</body>
</html>
