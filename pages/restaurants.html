<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurants - Foodpanda</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/restaurants.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <nav class="navbar">
            <div class="nav-container">
                <div class="nav-brand">
                    <img src="../images/logo.png" alt="Foodpanda" class="logo">
                </div>
                <div class="nav-menu">
                    <ul class="nav-list">
                        <li><a href="../index.html" class="nav-link">Home</a></li>
                        <li><a href="restaurants.html" class="nav-link active">Restaurants</a></li>
                        <li><a href="about.html" class="nav-link">About</a></li>
                        <li><a href="contact.html" class="nav-link">Contact</a></li>
                    </ul>
                </div>
                <div class="nav-actions">
                    <button class="btn-login" onclick="location.href='login.html'">Log In</button>
                    <button class="btn-signup" onclick="location.href='signup.html'">Sign Up</button>
                    <div class="cart-icon" onclick="location.href='cart.html'">
                        <i class="fas fa-shopping-cart"></i>
                        <span class="cart-count">0</span>
                    </div>
                </div>
                <div class="mobile-menu-toggle">
                    <i class="fas fa-bars"></i>
                </div>
            </div>
        </nav>
    </header>

    <!-- Page Header -->
    <section class="page-header">
        <div class="container">
            <h1>Restaurants Near You</h1>
            <p>Discover amazing food from local restaurants</p>
        </div>
    </section>

    <!-- Filters and Search -->
    <section class="filters-section">
        <div class="container">
            <div class="filters-container">
                <!-- Search Bar -->
                <div class="search-bar">
                    <i class="fas fa-search"></i>
                    <input type="text" placeholder="Search restaurants or cuisines..." id="restaurantSearch">
                </div>
                
                <!-- Filter Buttons -->
                <div class="filter-buttons">
                    <button class="filter-btn active" data-filter="all">All</button>
                    <button class="filter-btn" data-filter="pizza">Pizza</button>
                    <button class="filter-btn" data-filter="burger">Burgers</button>
                    <button class="filter-btn" data-filter="asian">Asian</button>
                    <button class="filter-btn" data-filter="dessert">Desserts</button>
                    <button class="filter-btn" data-filter="fast-food">Fast Food</button>
                    <button class="filter-btn" data-filter="healthy">Healthy</button>
                </div>
                
                <!-- Sort Options -->
                <div class="sort-options">
                    <label for="sortSelect">Sort by:</label>
                    <select id="sortSelect">
                        <option value="rating">Rating</option>
                        <option value="delivery-time">Delivery Time</option>
                        <option value="delivery-fee">Delivery Fee</option>
                        <option value="name">Name</option>
                    </select>
                </div>
            </div>
        </div>
    </section>

    <!-- Restaurants Grid -->
    <section class="restaurants-section">
        <div class="container">
            <div class="restaurants-header">
                <h2 id="restaurantsCount">All Restaurants</h2>
                <div class="view-toggle">
                    <button class="view-btn active" data-view="grid">
                        <i class="fas fa-th"></i>
                    </button>
                    <button class="view-btn" data-view="list">
                        <i class="fas fa-list"></i>
                    </button>
                </div>
            </div>
            
            <div class="restaurants-container" id="restaurantsContainer">
                <!-- Restaurants will be loaded here -->
            </div>
            
            <!-- Load More Button -->
            <div class="load-more-container">
                <button class="btn btn-secondary" id="loadMoreBtn">Load More Restaurants</button>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-section">
                    <h3>Company</h3>
                    <ul>
                        <li><a href="about.html">About Us</a></li>
                        <li><a href="#">Careers</a></li>
                        <li><a href="#">Press</a></li>
                    </ul>
                </div>
                <div class="footer-section">
                    <h3>Support</h3>
                    <ul>
                        <li><a href="contact.html">Contact Us</a></li>
                        <li><a href="#">Help Center</a></li>
                        <li><a href="#">Terms of Service</a></li>
                    </ul>
                </div>
                <div class="footer-section">
                    <h3>Follow Us</h3>
                    <div class="social-links">
                        <a href="#"><i class="fab fa-facebook"></i></a>
                        <a href="#"><i class="fab fa-twitter"></i></a>
                        <a href="#"><i class="fab fa-instagram"></i></a>
                    </div>
                </div>
            </div>
            <div class="footer-bottom">
                <p>&copy; 2024 Foodpanda Clone. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="../js/main.js"></script>
    <script src="../js/restaurants.js"></script>
</body>
</html>
